<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">RegisterAllocationProject logo</title>
  <desc id="desc">Rounded square orange gradient logo with white digits 01 above 10.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05a24"/>
      <stop offset="100%" stop-color="#ff9b38"/>
    </linearGradient>
  </defs>
  <rect x="76" y="76" width="872" height="872" rx="138" fill="url(#bg)"/>
  <g fill="#f7f7f7" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" text-anchor="middle">
    <text x="512" y="505" font-size="330" letter-spacing="8">01</text>
    <text x="512" y="815" font-size="330" letter-spacing="8">10</text>
  </g>
</svg>
